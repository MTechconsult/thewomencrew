<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The Women Crew | Learn • Grow • Glow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Feminine confidence, beauty and better relationships. Premium guides by The Women Crew.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--wine:#6b0b2b;--wine2:#8f1240;--rose:#f8dde4;--cream:#fff8f5;--gold:#c9a24b;--gold2:#f1d684;--ink:#2b1620;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;line-height:1.15;margin:0}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
.gold{background:linear-gradient(100deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
header{position:absolute;inset:0 0 auto;z-index:5;display:flex;justify-content:center;padding:18px 0}
#logo{touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;user-select:none;-webkit-user-select:none;color:#fff;-webkit-tap-highlight-color:transparent}
#logo .crest{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#a3174b,var(--wine));border:2px solid var(--gold);display:grid;place-items:center;box-shadow:0 8px 24px #0005,inset 0 0 14px #0006;transition:transform .15s}
#logo:active .crest{transform:scale(.92)}
#logo b{font:700 13px "Playfair Display",serif;letter-spacing:.22em}
#logo small{font-size:10px;letter-spacing:.3em;color:var(--gold2);text-transform:uppercase}
.hero{position:relative;background:radial-gradient(1000px 500px at 80% 10%,#ff4fb066,transparent),linear-gradient(160deg,#1c0838,#4b1475 55%,#a5218f);color:#fff;padding:150px 0 90px;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 9s ease-in-out infinite}
.hero:before{width:320px;height:320px;background:var(--gold);left:-80px;top:120px}
.hero:after{width:380px;height:380px;background:#ff5cc8;right:-100px;bottom:-80px;animation-delay:-4s}
.hero .wrap{position:relative;z-index:2;display:grid;gap:40px;align-items:center}
.eyebrow{display:inline-block;padding:7px 16px;border:1px solid #c9a24b99;border-radius:99px;font-size:13px;letter-spacing:.05em;background:#ffffff12;backdrop-filter:blur(6px)}
.hero h1{font-size:clamp(36px,7vw,66px);margin:18px 0 16px;font-weight:800}
.hero p{font-size:clamp(16px,2.2vw,19px);color:#fbe7ee;max-width:560px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:600 16px Inter,sans-serif;color:#3b0a1b;padding:15px 30px;border-radius:99px;text-decoration:none;background:linear-gradient(110deg,var(--gold),var(--gold2) 40%,var(--gold) 70%);background-size:200% 100%;box-shadow:0 10px 28px #c9a24b55;transition:.3s;position:relative;overflow:hidden}
.btn:hover{background-position:100% 0;transform:translateY(-2px)}
.btn.sm{padding:11px 20px;font-size:14px}
.btn.ghost{background:transparent;color:#fff;border:1px solid #fff8;box-shadow:none}
.stack{display:flex;justify-content:center;align-items:center;perspective:1200px;min-height:300px}
.stack img{width:30%;max-width:210px;border-radius:6px;box-shadow:0 25px 50px #0008;transition:.5s;cursor:pointer}
.stack img:nth-child(1){transform:rotateY(18deg) translateX(14px);animation:float 6s ease-in-out infinite}
.stack img:nth-child(2){transform:scale(1.18) translateZ(40px);z-index:2;animation:float 7s ease-in-out -2s infinite}
.stack img:nth-child(3){transform:rotateY(-18deg) translateX(-14px);animation:float 6.5s ease-in-out -4s infinite}
@keyframes float{50%{translate:0 -14px}}
section{padding:80px 0}
.sec-h{text-align:center;max-width:680px;margin:0 auto 46px}
.sec-h .k{color:var(--wine2);letter-spacing:.25em;font-size:12px;text-transform:uppercase;font-weight:600}
.sec-h h2{font-size:clamp(28px,5vw,44px);margin:10px 0;color:var(--wine)}
.sec-h p{color:#6b4a57;margin:0}
.pillars{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.pil{background:#fff;border:1px solid #f0d3dc;border-radius:22px;padding:28px;text-align:center;box-shadow:0 10px 30px #6b0b2b10}
.pil span{font-size:34px}.pil h3{font-size:22px;color:var(--wine);margin:8px 0}.pil p{margin:0;color:#6b4a57;font-size:15px}
.grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{position:relative;background:#fff;border-radius:26px;padding:22px;border:1px solid #f0d3dc;box-shadow:0 14px 40px #6b0b2b14;cursor:pointer;transition:.35s;overflow:hidden;display:flex;flex-direction:column}
.card:hover{transform:translateY(-8px);box-shadow:0 26px 60px #6b0b2b33}
.card .cv{position:relative;border-radius:10px;overflow:hidden;background:var(--rose);padding:18px;display:grid;place-items:center}
.card .cv img{width:68%;border-radius:5px;box-shadow:0 18px 30px #0005;transition:.5s}
.card:hover .cv img{transform:scale(1.06) rotate(-2deg)}
.card .cv:after,.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#fff9 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.card:hover .cv:after{transform:translateX(120%);transition:1s}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--wine2);font-weight:600;margin:16px 0 6px}
.card h3{font-size:24px;color:var(--wine)}
.card p{color:#6b4a57;font-size:15px;margin:8px 0 14px;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font:700 22px "Playfair Display",serif;color:var(--wine)}
.price s{font:400 14px Inter;color:#a58593;margin-right:6px}
.bundle{background:linear-gradient(160deg,#3d0519,var(--wine));color:#fff;position:relative;overflow:hidden}
.bundle .wrap{display:grid;gap:36px;align-items:center}
.bundle img{width:100%;border-radius:16px;box-shadow:0 30px 70px #000a;animation:float 8s ease-in-out infinite}
.bundle h2{font-size:clamp(30px,5vw,48px);margin:10px 0 14px}
.bundle ul,.pop ul{list-style:none;padding:0;margin:18px 0}
.bundle li,.pop li{padding:5px 0 5px 28px;position:relative}
.bundle li:before,.pop li:before{content:"✓";position:absolute;left:0;color:var(--gold);font-weight:700}
.save{display:inline-block;background:var(--gold);color:#3b0a1b;font-weight:700;font-size:13px;padding:6px 14px;border-radius:99px;letter-spacing:.04em}
.bundle .price{color:#fff;font-size:40px}.bundle .price s{color:#e8b9c8;font-size:20px}
.note{font-size:13px;color:#e8b9c8;margin-top:12px}
.final{text-align:center;background:var(--rose)}
.final h2{font-size:clamp(28px,5vw,46px);color:var(--wine);margin-bottom:14px}
footer{background:#2a0412;color:#d9a9bb;text-align:center;padding:34px 20px;font-size:14px}
.rv{opacity:0;transform:translateY(26px);transition:.8s}.rv.in{opacity:1;transform:none}
@media(min-width:860px){.hero .wrap{grid-template-columns:1.05fr .95fr}.bundle .wrap{grid-template-columns:1.1fr 1fr}}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:#1d0510cc;backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px;overflow:auto}
.ov.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}@keyframes pop{0%{transform:scale(.6) translateY(40px);opacity:0}70%{transform:scale(1.04)}100%{transform:none;opacity:1}}
.pop{position:relative;width:min(900px,100%);margin:auto;background:linear-gradient(150deg,#fff,var(--rose));border-radius:28px;padding:30px;display:grid;gap:26px;border:1px solid var(--gold);box-shadow:0 40px 100px #000a,0 0 0 6px #c9a24b33;animation:pop .55s cubic-bezier(.2,1.2,.3,1)}
@media(min-width:760px){.pop{grid-template-columns:.8fr 1fr;align-items:center}}
.x{position:absolute;right:14px;top:10px;border:0;background:var(--wine);color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;z-index:3}
.stage{perspective:900px;display:grid;place-items:center}
.cover{position:relative;width:min(280px,70%);border-radius:6px;overflow:hidden;box-shadow:0 30px 60px #000a,0 0 40px #c9a24b66;transition:transform .15s;animation:glow 3s ease-in-out infinite}
.cover img{display:block;width:100%}
.cover:after{animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
@keyframes glow{50%{box-shadow:0 30px 60px #000a,0 0 70px #f1d684aa}}
.pop h2{font-size:clamp(26px,4vw,36px);color:var(--wine);margin:6px 0 10px}
.pop p{color:#5b3d49;margin:0}
.pop li{color:#3d2530}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--wine);color:#fff;padding:12px 22px;border-radius:99px;z-index:90;font-size:14px;display:none}
/* admin */
#adm .ov{align-items:flex-start;background:#120309ee}
.ap{background:#fff;color:var(--ink);width:min(980px,100%);margin:auto;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px #000a}
.ah{background:linear-gradient(90deg,#3d0519,var(--wine));color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:4}
.ah h2{font-size:20px}.ab{padding:20px}
.a-sec{border:1px solid #ecd5dd;border-radius:14px;padding:16px;margin-bottom:16px;background:#fffbfc}
.a-sec h3{font:600 15px Inter;color:var(--wine);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.f label{display:grid;gap:4px;font-size:12px;font-weight:600;color:#6b4a57}.f .w{grid-column:1/-1}
.f input,.f textarea{font:14px Inter;padding:10px;border:1px solid #dcbfca;border-radius:9px;width:100%;background:#fff;color:var(--ink)}
.f textarea{min-height:70px;resize:vertical}
.ib{display:flex;gap:10px;align-items:center}.ib img{width:54px;height:72px;object-fit:cover;border-radius:5px;border:1px solid #dcbfca}
.sb{border:1px solid #dcbfca;background:#fff;border-radius:8px;padding:7px 12px;font:600 12px Inter;cursor:pointer;color:var(--wine)}
.sb.d{color:#b00020;border-color:#e6b3bd}.sb.on{background:#e8f6ec;color:#146c2e;border-color:#a9d8b6}.sb.off{background:#f3eef0;color:#7a6a71}
.lg{max-width:360px;background:#fff;border-radius:20px;padding:28px;margin:12vh auto;text-align:center;box-shadow:0 30px 80px #000a;color:var(--ink)}
.lg h2{color:var(--wine);font-size:24px;margin-bottom:6px}.lg input{width:100%;padding:12px;border:1px solid #dcbfca;border-radius:10px;margin:14px 0;font:15px Inter}
.err{color:#b00020;font-size:13px;min-height:18px}
</style></head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S=JSON.parse($("#state").textContent);
const fm=n=>S.cfg.cur+Number(n||0).toLocaleString();
const safe=u=>/^https:\/\//.test(u||"")?u:"";
function toast(x){const t=$("#t");t.textContent=x;t.style.display="block";clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display="none",2600)}
function buy(u){const l=safe(u);if(l)window.open(l,"_blank","noopener");else toast("Checkout link coming soon ✨")}
const vis=()=>S.books.filter(b=>b.visible);
function render(){
const B=vis(),bd=S.bundle,tot=B.reduce((a,b)=>a+Number(b.price||0),0);
$("#app").innerHTML=`
<section class="hero"><div class="wrap"><div><span class="eyebrow">${esc(S.cfg.eyebrow)}</span><h1>${S.cfg.headline}</h1><p>${esc(S.cfg.sub)}</p><p style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="#books">Explore the Guides</a>${bd.visible?'<a class="btn ghost" href="#bundle">See the 3-in-1 Bundle</a>':''}</p></div>
<div class="stack">${B.slice(0,3).map(b=>`<img src="${b.img}" alt="${esc(b.title)}" data-o="${b.id}">`).join("")}</div></div></section>
<section><div class="wrap rv"><div class="sec-h"><div class="k">What we stand for</div><h2>She doesn’t beg. She glows.</h2><p>Real confidence isn’t loud. It’s quietly unshakeable. Here’s where it begins.</p></div>
<div class="pillars"><div class="pil"><span>👑</span><h3>Feminine Confidence</h3><p>Know your worth, stand in your power and never shrink to be chosen.</p></div><div class="pil"><span>🌸</span><h3>Beauty &amp; Self-Care</h3><p>Look polished, feel radiant and build routines that honour the woman you are.</p></div><div class="pil"><span>💞</span><h3>Better Relationships</h3><p>Set healthy boundaries and love deeply, without losing yourself.</p></div></div></div></section>
<section id="books" style="background:#fff2f5"><div class="wrap"><div class="sec-h rv"><div class="k">The Collection</div><h2>Choose your next chapter</h2><p>Tap any guide to peek inside.</p></div>
<div class="grid">${B.map(b=>`<article class="card rv" data-o="${b.id}"><div class="cv"><img src="${b.img}" alt="${esc(b.title)}"></div><div class="tag">${esc(b.tag)}</div><h3>${esc(b.title)}</h3><p>${esc(b.pitch)}</p><div class="row" style="justify-content:${S.cfg.showCardPrice?'space-between':'center'}">${S.cfg.showCardPrice?`<div class="price">${fm(b.price)}</div>`:""}<span class="btn sm">View Details</span></div></article>`).join("")}</div></div></section>
${bd.visible?`<section id="bundle" class="bundle"><div class="wrap"><div class="rv"><img src="${bd.img}" alt="${esc(bd.title)}"></div><div class="rv"><span class="save">SAVE ${tot>bd.price?Math.round((1-bd.price/tot)*100):0}% · BEST VALUE</span><h2>${esc(bd.title)}</h2><p class="gold" style="font:600 19px 'Playfair Display',serif;margin:0 0 10px">Three guides. One complete glow-up.</p><p style="color:#fbe7ee">${esc(bd.pitch)}</p><ul>${B.map(b=>`<li>${esc(b.title)}</li>`).join("")}</ul>${S.cfg.showBundlePrice?`<div class="price"><s style="margin-right:12px">${fm(tot)}</s>${fm(bd.price)}</div>`:""}<p style="margin:20px 0 0"><button class="btn" id="bb">Get the 3-in-1 Bundle</button></p><div class="note">Instant digital access · Secure checkout on Selar</div></div></div></section>`:""}
<section class="final"><div class="wrap rv"><h2>Your glow-up starts today.</h2><p style="max-width:520px;margin:0 auto 26px;color:#6b4a57">Take care. Glow. Grow. Become the woman you aspire to be.</p><a class="btn" href="${bd.visible?'#bundle':'#books'}">Begin Now ✨</a></div></section>
<footer>© ${new Date().getFullYear()} The Women Crew · Learn • Grow • Glow</footer>`;
const bb=$("#bb");if(bb)bb.onclick=()=>openBook("bundle");
document.querySelectorAll("[data-o]").forEach(e=>e.onclick=()=>openBook(e.dataset.o));
reveal()}
function reveal(){const els=document.querySelectorAll(".rv");if(!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("in"));return}
const io=new IntersectionObserver(r=>r.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}
function openBook(id){
const B=id==="bundle"?{...S.bundle,tag:"3-in-1 Bundle",bullets:vis().map(b=>b.title)}:S.books.find(b=>b.id===id);if(!B)return;
const m=$("#m");m.innerHTML=`<div class="pop"><button class="x" aria-label="Close">×</button><div class="stage"><div class="cover"><img src="${B.img}" alt=""></div></div><div><div class="tag" style="margin-top:0">${esc(B.tag)}</div><h2>${esc(B.title)}</h2><p>${esc(B.pitch)}</p><ul>${(B.bullets||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="row" style="justify-content:${S.cfg.showPopPrice?'space-between':'flex-start'}">${S.cfg.showPopPrice?`<div class="price">${fm(B.price)}</div>`:""}<button class="btn" id="pb">${id==="bundle"?"Get the Bundle":"Get Instant Access"}</button></div><p style="font-size:12px;margin-top:10px;color:#8a6a77">Secure checkout on Selar · Instant digital delivery</p></div></div>`;
m.classList.add("on");document.body.style.overflow="hidden";
const cv=m.querySelector(".cover");m.querySelector(".stage").onmousemove=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;cv.style.transform=`rotateY(${x*22}deg) rotateX(${-y*22}deg)`};
m.querySelector(".stage").onmouseleave=()=>cv.style.transform="";
$("#pb").onclick=()=>buy(B.link);m.querySelector(".x").onclick=closeM;m.onclick=e=>{if(e.target===m)closeM()}}
function closeM(){$("#m").classList.remove("on");document.body.style.overflow=""}
addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
/* ---------- ADMIN ---------- */
let clicks=0,ck;
$("#logo").onclick=()=>{clearTimeout(ck);if(++clicks>=11){clicks=0;login()}else ck=setTimeout(()=>clicks=0,5000)};
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function login(){$("#adm").innerHTML=`<div class="ov on"><div class="lg"><h2>Admin Access</h2><div style="font-size:13px;color:#6b4a57">The Women Crew · Dashboard</div><input id="pw" type="password" placeholder="Enter password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="err" id="er"></div><button class="btn" id="go" style="width:100%">Unlock</button><p><button class="sb" id="cn">Cancel</button></p></div></div>`;
const go=async()=>{try{if(await sha($("#pw").value.trim())===S.cfg.pw){panel()}else $("#er").textContent="Incorrect password."}catch(e){$("#er").textContent="Secure context required."}};
$("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};$("#cn").onclick=()=>$("#adm").innerHTML="";$("#pw").focus()}
const fld=(l,k,v,t)=>`<label class="${t==="w"||t==="ta"?"w":""}">${l}${t==="ta"?`<textarea data-k="${k}">${esc(v)}</textarea>`:`<input data-k="${k}" value="${esc(v)}">`}</label>`;
function imgIn(i,src){return`<div class="ib"><img src="${src}" alt=""><label class="sb">Replace cover<input type="file" accept="image/*" data-i="${i}" hidden></label></div>`}
function panel(){const A=$("#adm");
A.innerHTML=`<div class="ov on"><div class="ap"><div class="ah"><h2>✨ Women Crew Admin</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="sv">Save &amp; Publish</button><button class="btn sm" id="dl">Download Page</button><button class="btn sm ghost" id="lo">Close</button></div></div><div class="ab">
<div class="a-sec"><h3>Site settings</h3><div class="f" data-s="cfg">${fld("Top badge","eyebrow",S.cfg.eyebrow)}${fld("Currency symbol","cur",S.cfg.cur)}${fld("Hero headline (HTML allowed: &lt;span class=&quot;gold&quot;&gt;)","headline",S.cfg.headline,"w")}${fld("Hero text","sub",S.cfg.sub,"ta")}<label>New password (leave blank to keep)<input id="np" type="password" autocomplete="new-password"></label><label>Show prices on ebook cards<button class="sb ${S.cfg.showCardPrice?"on":"off"}" data-cp>${S.cfg.showCardPrice?"Shown":"Hidden"}</button></label><label>Show bundle price on page<button class="sb ${S.cfg.showBundlePrice?"on":"off"}" data-bp>${S.cfg.showBundlePrice?"Shown":"Hidden"}</button></label><label>Show price in pop-up<button class="sb ${S.cfg.showPopPrice?"on":"off"}" data-pp>${S.cfg.showPopPrice?"Shown":"Hidden"}</button></label></div></div>
<div class="a-sec" data-s="bundle"><h3>3-in-1 Bundle <span><button class="sb ${S.bundle.visible?"on":"off"}" data-tg="bundle">${S.bundle.visible?"Visible":"Hidden"}</button></span></h3><div class="f">${fld("Title","title",S.bundle.title)}${fld("Bundle price (number)","price",S.bundle.price)}${fld("Selar link (https://…)","link",S.bundle.link)}${fld("Description","pitch",S.bundle.pitch,"ta")}</div><p>${imgIn("bundle",S.bundle.img)}</p></div>
<h3 style="color:var(--wine);font:600 16px Inter;display:flex;justify-content:space-between;align-items:center">Ebooks <button class="sb" id="ad">+ Add ebook</button></h3>
${S.books.map((b,i)=>`<div class="a-sec" data-s="b${i}"><h3>${esc(b.title)||"New ebook"}<span style="display:flex;gap:6px;flex-wrap:wrap"><button class="sb" data-mv="${i},-1">↑</button><button class="sb" data-mv="${i},1">↓</button><button class="sb ${b.visible?"on":"off"}" data-tg="${i}">${b.visible?"Visible":"Hidden"}</button><button class="sb d" data-dl="${i}">Delete</button></span></h3><div class="f">${fld("Title","title",b.title)}${fld("Category tag","tag",b.tag)}${fld("Price (number)","price",b.price)}${fld("Selar link (https://…)","link",b.link)}${fld("Sales pitch","pitch",b.pitch,"ta")}${fld("Bullet points (one per line)","bullets",(b.bullets||[]).join("\n"),"ta")}</div><p>${imgIn(i,b.img)}</p></div>`).join("")}
<div class="err" id="st" style="color:#146c2e"></div></div></div></div>`;
const ov=A.querySelector(".ov");
ov.querySelectorAll("[data-s]").forEach(g=>g.querySelectorAll("input[data-k],textarea[data-k]").forEach(el=>el.oninput=()=>{const s=g.dataset.s,k=el.dataset.k;const o=s==="cfg"?S.cfg:s==="bundle"?S.bundle:S.books[+s.slice(1)];o[k]=k==="bullets"?el.value.split("\n").map(x=>x.trim()).filter(Boolean):k==="price"?Number(el.value)||0:el.value;render()}));
ov.querySelectorAll("input[type=file]").forEach(f=>f.onchange=async()=>{const file=f.files[0];if(!file)return;const u=await shrink(file);f.dataset.i==="bundle"?S.bundle.img=u:S.books[+f.dataset.i].img=u;render();panel()});
ov.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{const o=b.dataset.tg==="bundle"?S.bundle:S.books[+b.dataset.tg];o.visible=!o.visible;render();panel()});
ov.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const[i,d]=b.dataset.mv.split(",").map(Number),j=i+d;if(j<0||j>=S.books.length)return;[S.books[i],S.books[j]]=[S.books[j],S.books[i]];render();panel()});
